<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>每日巡查</title>
  <!-- docx.js 用于生成 Word 文档 -->
  <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
  <style>
    /* ===== 全局重置 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1976d2;
      --primary-dark: #1565c0;
      --primary-light: #e3f2fd;
      --danger: #e53935;
      --success: #43a047;
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --text: #333;
      --text-muted: #888;
      --border: #e0e0e0;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== 顶部栏 ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--primary);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(25,118,210,0.3);
    }

    .header-left h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .header-left .date {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    .header-right .badge {
      background: rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 500;
    }

    /* ===== 操作区 ===== */
    .action-bar {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 22px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(25,118,210,0.35);
      cursor: pointer;
      user-select: none;
    }

    .btn-primary:active { background: var(--primary-dark); transform: scale(0.97); }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--primary);
      border: 2.5px solid var(--primary);
    }

    .btn-secondary:active { background: var(--primary-light); transform: scale(0.97); }

    /* ===== 空状态 ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
    .empty-state p { font-size: 15px; line-height: 1.6; }

    /* ===== 照片网格 ===== */
    .photo-grid {
      padding: 0 16px 100px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    @media (max-width: 480px) {
      .photo-grid { grid-template-columns: 1fr; }
    }

    /* ===== 照片卡片 ===== */
    .photo-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .photo-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }

    .photo-card-header {
      position: relative;
      background: #000;
      line-height: 0;
    }

    .photo-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .photo-number {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    .photo-time {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
    }

    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(229,57,53,0.85);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      backdrop-filter: blur(4px);
    }

    .delete-btn:hover { background: var(--danger); }

    .photo-card-body {
      padding: 12px;
    }

    .remark-input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: #fafafa;
      resize: vertical;
      min-height: 70px;
      transition: border-color 0.15s;
      line-height: 1.5;
    }

    .remark-input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }

    .remark-input::placeholder { color: #bbb; }

    /* ===== 底部导出栏 ===== */
    .export-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
      z-index: 100;
    }

    .btn-export {
      width: 100%;
      padding: 22px;
      background: linear-gradient(135deg, var(--primary), #1565c0);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(25,118,210,0.4);
      transition: all 0.18s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 1px;
    }

    .btn-export:active { transform: scale(0.98); }
    .btn-export:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

    /* ===== 提示 Toast ===== */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== 加载动画 ===== */
    .btn-export .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 拍照提示条 ===== */
    .camera-tip {
      display: none;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      margin: 0 16px;
      line-height: 1.5;
    }
    .camera-tip.show { display: block; }
  </style>
</head>
<body>

<!-- 顶部栏 -->
<header class="header">
  <div class="header-left">
    <h1>📋 每日巡查</h1>
    <div class="date" id="headerDate"></div>
  </div>
  <div class="header-right">
    <span class="badge" id="photoBadge">0 张照片</span>
  </div>
</header>

<!-- 操作按钮 -->
<div class="action-bar">
  <!-- 调用系统原生相机：capture="environment" 确保打开后置摄像头 -->
  <label class="btn btn-primary" for="cameraInput">
    📷 拍照
  </label>
  <button class="btn btn-secondary" onclick="selectFile()">
    📁 选择图片
  </button>
</div>

<!-- 原生相机使用提示 -->
<div class="camera-tip show" id="cameraTip">
  💡 点击"拍照"将打开手机相机，可使用全部相机功能（变焦、对焦、HDR等）
</div>

<!-- 照片列表 -->
<div id="photoGrid" class="photo-grid"></div>

<!-- 空状态 -->
<div id="emptyState" class="empty-state">
  <div class="icon">📸</div>
  <p>还没有照片<br />点击"拍照"开始巡查</p>
</div>

<!-- 底部导出栏 -->
<div class="export-bar">
  <button class="btn-export" id="exportBtn" onclick="exportWord()">
    <span class="spinner" id="exportSpinner"></span>
    <span id="exportBtnText">📄 导出 Word 文档</span>
  </button>
</div>

<!-- 隐藏的系统相机 input：capture="environment" 强制调用后置相机 -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleCameraCapture(event)" />

<!-- 隐藏的文件选择 input（不使用 capture，允许从相册选择） -->
<input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFileSelect(event)" />

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  数据层
// ============================================================
let photos = []; // { id, dataURL, time, remark }
let _idCounter = 0;

// ============================================================
//  初始化
// ============================================================
(function init() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  document.getElementById('headerDate').textContent = dateStr;

  // 3 秒后自动隐藏相机提示
  setTimeout(() => {
    const tip = document.getElementById('cameraTip');
    if (tip) tip.classList.remove('show');
  }, 5000);
})();

// ============================================================
//  系统原生相机拍照（核心入口）
// ============================================================

/**
 * 系统相机回调 - capture="environment" 会打开手机原生相机App
 * 原生相机完整支持：变焦（捏合/滑动）、对焦（点击）、HDR、夜间模式、闪光灯等
 */
function handleCameraCapture(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  // 隐藏提示条
  const tip = document.getElementById('cameraTip');
  if (tip) tip.classList.remove('show');

  // 读取图片并自动修正 EXIF 方向，然后压缩
  processAndAddPhoto(file);

  // 重置 input，允许连续拍照
  event.target.value = '';
}

// ============================================================
//  文件选择（从相册）
// ============================================================
function selectFile() {
  document.getElementById('fileInput').click();
}

function handleFileSelect(event) {
  const files = Array.from(event.target.files);
  if (!files.length) return;

  let loaded = 0;
  files.forEach(file => {
    processAndAddPhoto(file, () => {
      loaded++;
      if (loaded === files.length) {
        showToast('已添加 ' + files.length + ' 张照片');
      }
    });
  });

  event.target.value = '';
}

// ============================================================
//  图片处理：EXIF 方向校正 + 压缩
// ============================================================

/**
 * 处理图片文件：修正 EXIF 旋转 + 压缩到合理尺寸
 * 手机拍的照片经常有 EXIF Orientation 标记，浏览器 <img> 会自动旋转
 * 但 Canvas 不会，所以需要手动校正后再压缩
 */
function processAndAddPhoto(file, callback) {
  readExifOrientation(file).then(orientation => {
    compressImage(file, 1920, 0.88, orientation).then(dataURL => {
      addPhoto(dataURL);
      if (!callback) showToast('照片已添加');
      if (callback) callback();
    });
  });
}

/**
 * 读取图片的 EXIF Orientation 值
 * 返回 1-8 的数字，1 表示无需旋转
 */
function readExifOrientation(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const view = new DataView(e.target.result);
        // 检查 JPEG 标记
        if (view.getUint16(0, false) !== 0xFFD8) { resolve(1); return; }
        let offset = 2;
        while (offset < view.byteLength - 2) {
          const marker = view.getUint16(offset, false);
          offset += 2;
          // APP1 = EXIF
          if (marker === 0xFFE1) {
            const length = view.getUint16(offset, false);
            // 检查 "Exif" 标识
            if (offset + 6 <= view.byteLength &&
                String.fromCharCode(view.getUint8(offset + 2), view.getUint8(offset + 3),
                                     view.getUint8(offset + 4), view.getUint8(offset + 5)) === 'Exif') {
              // 找到 TIFF 头
              const tiffOffset = offset + 6;
              const littleEndian = view.getUint16(tiffOffset, false) === 0x4949;
              // IFD0 偏移
              const ifdOffset = view.getUint32(tiffOffset + 4, littleEndian);
              const ifdStart = tiffOffset + ifdOffset;
              const numEntries = view.getUint16(ifdStart, littleEndian);
              // 遍历 IFD 条目查找 Orientation (tag 0x0112)
              for (let i = 0; i < numEntries; i++) {
                const entryOffset = ifdStart + 2 + i * 12;
                if (entryOffset + 12 > view.byteLength) break;
                const tag = view.getUint16(entryOffset, littleEndian);
                if (tag === 0x0112) {
                  resolve(view.getUint16(entryOffset + 8, littleEndian));
                  return;
                }
              }
            }
            offset += length;
          } else if ((marker & 0xFF00) === 0xFF00) {
            offset += view.getUint16(offset, false);
          } else {
            break;
          }
        }
      } catch (ex) { /* 解析失败则不旋转 */ }
      resolve(1);
    };
    reader.onerror = () => resolve(1);
    // 只读取前 64KB 用于 EXIF 解析
    reader.readAsArrayBuffer(file.slice(0, 65536));
  });
}

/**
 * 压缩图片，同时根据 EXIF Orientation 校正旋转
 * @param {File} file       图片文件
 * @param {number} maxWidth 最大宽度
 * @param {number} quality  JPEG 质量 0-1
 * @param {number} orientation EXIF Orientation (1-8)
 */
function compressImage(file, maxWidth, quality, orientation) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth;
        let h = img.naturalHeight;

        // 根据 EXIF Orientation 计算旋转后的尺寸
        let needRotate = false;
        if (orientation >= 5 && orientation <= 8) {
          // 90° 或 270° 旋转，宽高互换
          needRotate = true;
          [w, h] = [h, w];
        }

        // 等比例缩放
        if (w > maxWidth) {
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        }

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        // 应用 EXIF 旋转
        if (orientation && orientation !== 1) {
          ctx.save();
          ctx.translate(w / 2, h / 2);
          switch (orientation) {
            case 2: ctx.scale(-1, 1); break;                  // 水平翻转
            case 3: ctx.rotate(Math.PI); break;                // 180°
            case 4: ctx.scale(1, -1); break;                   // 垂直翻转
            case 5: ctx.rotate(Math.PI / 2); ctx.scale(1, -1); break;  // 90° CW + 水平翻转
            case 6: ctx.rotate(Math.PI / 2); break;            // 90° CW
            case 7: ctx.rotate(-Math.PI / 2); ctx.scale(1, -1); break; // 90° CCW + 水平翻转
            case 8: ctx.rotate(-Math.PI / 2); break;           // 90° CCW
          }
          ctx.translate(-img.naturalWidth / 2, -img.naturalHeight / 2);
          ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight);
          ctx.restore();
        } else {
          ctx.drawImage(img, 0, 0, w, h);
        }

        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ============================================================
//  照片管理
// ============================================================
function addPhoto(dataURL) {
  const now = new Date();
  const time = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const photo = { id: generateId(), dataURL, time, remark: '' };
  photos.push(photo);

  // 追加单张卡片
  const grid = document.getElementById('photoGrid');
  const empty = document.getElementById('emptyState');
  empty.style.display = 'none';

  const idx = photos.length - 1;
  const card = document.createElement('div');
  card.className = 'photo-card';
  card.id = 'card-' + photo.id;
  card.innerHTML = `
    <div class="photo-card-header">
      <img src="${photo.dataURL}" alt="巡查照片 ${idx + 1}" loading="lazy" />
      <span class="photo-number">No.${idx + 1}</span>
      <span class="photo-time">${photo.time}</span>
      <button class="delete-btn" onclick="deletePhoto('${photo.id}')" title="删除">✕</button>
    </div>
    <div class="photo-card-body">
      <textarea
        class="remark-input"
        id="remark-${photo.id}"
        placeholder="请输入备注，如：巡查位置、发现问题等..."
        oninput="updateRemark('${photo.id}', this.value)"
      ></textarea>
    </div>
  `;
  grid.appendChild(card);

  // 更新徽章
  document.getElementById('photoBadge').textContent = photos.length + ' 张照片';

  // 拍照后自动聚焦备注框并滚动到该照片
  setTimeout(() => {
    const textarea = document.getElementById('remark-' + photo.id);
    if (textarea) {
      textarea.focus();
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }, 150);
}

function deletePhoto(id) {
  photos = photos.filter(p => p.id !== id);

  const card = document.getElementById('card-' + id);
  if (card) card.remove();

  document.getElementById('photoBadge').textContent = photos.length + ' 张照片';

  if (photos.length === 0) {
    document.getElementById('emptyState').style.display = 'flex';
  }

  // 重新编号
  const grid = document.getElementById('photoGrid');
  const cards = grid.querySelectorAll('.photo-card');
  cards.forEach((c, i) => {
    const numEl = c.querySelector('.photo-number');
    if (numEl) numEl.textContent = 'No.' + (i + 1);
  });

  showToast('已删除');
}

function updateRemark(id, value) {
  const p = photos.find(p => p.id === id);
  if (p) p.remark = value;
}

// ============================================================
//  导出 Word 文档
// ============================================================
async function exportWord() {
  if (photos.length === 0) {
    showToast('请先添加照片再导出');
    return;
  }

  syncRemarksFromDOM();
  setExportLoading(true);

  try {
    await buildAndDownloadDocx();
    showToast('导出成功！');
  } catch (err) {
    console.error('导出失败:', err);
    showToast('导出失败：' + err.message);
  } finally {
    setExportLoading(false);
  }
}

function syncRemarksFromDOM() {
  photos.forEach(p => {
    const card = document.getElementById('card-' + p.id);
    if (card) {
      const textarea = card.querySelector('.remark-input');
      if (textarea) p.remark = textarea.value;
    }
  });
}

async function buildAndDownloadDocx() {
  const {
    Document, Paragraph, TextRun, ImageRun,
    AlignmentType, HeadingLevel, Packer
  } = docx;

  const today = new Date();
  const dateLabel = today.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
  const fileDate = today.toISOString().slice(0, 10);

  const children = [];

  // 标题
  children.push(
    new Paragraph({
      text: '每日巡查报告',
      heading: HeadingLevel.HEADING_1,
      alignment: AlignmentType.CENTER,
      spacing: { after: 200 }
    })
  );

  // 巡查日期
  children.push(
    new Paragraph({
      children: [
        new TextRun({ text: '巡查日期：', bold: true, size: 24 }),
        new TextRun({ text: dateLabel, size: 24 }),
      ],
      alignment: AlignmentType.CENTER,
      spacing: { after: 600 }
    })
  );

  // 逐张照片
  for (let i = 0; i < photos.length; i++) {
    const p = photos[i];

    // 序号
    children.push(
      new Paragraph({
        children: [
          new TextRun({
            text: (i + 1) + '.',
            bold: true,
            size: 26,
            color: '333333'
          })
        ],
        spacing: { before: 300, after: 100 }
      })
    );

    // 插入图片
    try {
      const imageData = base64ToUint8Array(p.dataURL);
      const mimeType = getMimeType(p.dataURL);
      const dims = await getImageDimensions(p.dataURL);

      const MAX_WIDTH_PX = 540;
      const MAX_HEIGHT_PX = 400;
      let wPx = dims.width;
      let hPx = dims.height;

      if (wPx > MAX_WIDTH_PX) {
        hPx = Math.round(hPx * (MAX_WIDTH_PX / wPx));
        wPx = MAX_WIDTH_PX;
      }
      if (hPx > MAX_HEIGHT_PX) {
        wPx = Math.round(wPx * (MAX_HEIGHT_PX / hPx));
        hPx = MAX_HEIGHT_PX;
      }

      children.push(
        new Paragraph({
          children: [
            new ImageRun({
              data: imageData,
              transformation: { width: wPx, height: hPx },
              type: mimeType === 'image/png' ? 'png' : 'jpg'
            })
          ],
          alignment: AlignmentType.CENTER,
          spacing: { after: 80 }
        })
      );
    } catch (imgErr) {
      console.warn('图片插入失败', imgErr);
      children.push(
        new Paragraph({
          text: '[图片加载失败]',
          alignment: AlignmentType.CENTER,
          spacing: { after: 80 }
        })
      );
    }

    // 备注直接写在照片下方
    const remarkText = p.remark.trim();
    if (remarkText) {
      children.push(
        new Paragraph({
          children: [
            new TextRun({ text: remarkText, size: 22 })
          ],
          spacing: { after: 100 }
        })
      );
    }
  }

  const doc = new Document({
    sections: [{
      properties: {
        page: {
          margin: { top: 1080, bottom: 1080, left: 1260, right: 1260 }
        }
      },
      children
    }]
  });

  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '巡查报告_' + fileDate + '.docx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// ============================================================
//  工具函数
// ============================================================

function base64ToUint8Array(base64DataURL) {
  const base64 = base64DataURL.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

function getMimeType(dataURL) {
  const match = dataURL.match(/^data:([^;]+);/);
  return match ? match[1] : 'image/jpeg';
}

function getImageDimensions(dataURL) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
    img.onerror = () => resolve({ width: 800, height: 600 });
    img.src = dataURL;
  });
}

function generateId() {
  return Date.now().toString(36) + (_idCounter++).toString(36) + Math.random().toString(36).slice(2, 6);
}

function escapeHTML(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function setExportLoading(loading) {
  const btn = document.getElementById('exportBtn');
  const spinner = document.getElementById('exportSpinner');
  const text = document.getElementById('exportBtnText');
  btn.disabled = loading;
  spinner.style.display = loading ? 'block' : 'none';
  text.textContent = loading ? '正在生成文档...' : '📄 导出 Word 文档';
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
